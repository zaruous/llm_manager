name: Simple MCP Server
id: simple-mcp
description: "임베딩 없이 PostgreSQL을 조회만 하는 경량 MCP 서버 (테이블 목록·컬럼 구조·SELECT 실행). sql-gen-mcp의 TEI·벡터 스토어가 필요 없을 때 사용."
runtimeType: PYTHON
startCommand: "python server.py"
installDir: "${user.home}/llm-services/simple-mcp"
port: 7071
healthCheckPath: /health
installCommands:
  - "pip install fastmcp>=2.0.0 psycopg[binary]"
argSpecs:
  - name: port
    flag: "--port"
    type: INTEGER
    defaultValue: "7071"
    description: "[MCP 서버] MCP 프로토콜 포트 — Claude Code 등 MCP 클라이언트가 연결하는 포트 (sql-gen-mcp 7070과 구분)"
    enabled: true
  - name: db-url
    flag: "--db-url"
    type: STRING
    defaultValue: "jdbc:postgresql://192.168.45.7:5433/dbmes"
    description: "[DB] PostgreSQL 접속 URL. sql-gen-mcp와 같은 jdbc:postgresql://host:port/db 형식 그대로 사용 가능"
    enabled: true
  - name: db-user
    flag: "--db-user"
    type: STRING
    defaultValue: "tester1"
    description: "[DB] 접속 사용자명. SELECT 권한만 가진 읽기 전용 계정을 권장"
    enabled: true
  - name: db-pw
    flag: "--db-pw"
    type: STRING
    defaultValue: "tester1"
    description: "[DB] 접속 비밀번호"
    enabled: true
  - name: db-schema
    flag: "--db-schema"
    type: STRING
    defaultValue: "public"
    description: "[DB] 기본 스키마 (search_path). 도구 호출 시 schema 인수를 비우면 이 값을 사용"
    enabled: true
  - name: max-rows
    flag: "--max-rows"
    type: INTEGER
    defaultValue: "200"
    description: "[조회] run_query가 돌려주는 최대 행 수. 클라이언트가 더 큰 값을 요청해도 이 상한으로 자른다"
    enabled: true
  - name: statement-timeout
    flag: "--statement-timeout"
    type: INTEGER
    defaultValue: "30"
    description: "[조회] 쿼리 1건 제한 시간(초). 0이면 무제한"
    enabled: false
groovyScript: |
  // installDir은 설정 화면에서 입력한 값을 그대로 쓴다 (같은 팩 중복 등록 시 -2, -3 접미사 분리가 동작하도록)
  service.workingDir = service.installDir
  // OS에 따른 python 명령어
  service.startCommand = (os == 'windows') ? 'python server.py' : 'python3 server.py'

  // server.py는 설치 시 plugins/simple-mcp/에서 installDir로 복사하고, 실행은 installDir 기준으로 한다.
  // pluginsDir 바인딩은 AppContext.init()이 llm.pluginsDir 시스템 프로퍼티로 설정한 값이다.
  def serverFile = new File(new File(pluginsDir, 'simple-mcp'), 'server.py')
  def installDirFile = new File(service.installDir)
  def installedServer = new File(installDirFile, 'server.py')

  if (os == 'windows') {
    def psq = { s -> "'" + s.replace("'", "''") + "'" }
    def copyCommand = "powershell -NoProfile -ExecutionPolicy Bypass -Command \"New-Item -ItemType Directory -Force -Path ${psq(installDirFile.absolutePath)} | Out-Null; Copy-Item -LiteralPath ${psq(serverFile.absolutePath)} -Destination ${psq(installedServer.absolutePath)} -Force\""
    service.installCommands = [
      copyCommand.toString(),
      "pip install \"fastmcp>=2.0.0\" \"psycopg[binary]\""
    ]
  } else {
    def shQuote = { s -> "'" + s.replace("'", "'\"'\"'") + "'" }
    def copyCommand = "mkdir -p ${shQuote(installDirFile.absolutePath)} && cp -f ${shQuote(serverFile.absolutePath)} ${shQuote(installedServer.absolutePath)}"
    service.installCommands = [
      copyCommand.toString(),
      "pip install 'fastmcp>=2.0.0' 'psycopg[binary]'"
    ]
  }
